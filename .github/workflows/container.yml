name: container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/aixaria0/chimera-one

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: chimera-one:test
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke Python control plane
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges chimera-one:test capabilities
      - name: Smoke Rust protocol verifier
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint chimera-protocol chimera-one:test validate-run /opt/chimera-one/tests/vectors/run.valid.json
      - name: Verify test-key signed capture using the runtime OpenSSL backend
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "${PWD}/examples:/fixtures:ro" \
            chimera-one:test verify-capture-attestation /fixtures/offline-review/replay \
            --expect-receipt sha256:ad8ca4df8e73093232f1cd7302ed255287d9383a56e8ad55e52a768e7491d5a2 \
            --expect-key sha256:21fe31dfa154a261626bf854046fd2271b7bed4b6abe45aa58877ef47f9721b9 \
            --expect-signer test-vector-reviewer \
            --attestation /fixtures/capture-attestation/test-only.replay.attestation.json
      - name: Validate native capture build-link bytes without private provider access
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "${PWD}/examples:/fixtures:ro" \
            chimera-one:test validate-capture-build /fixtures/capture-build/native-replay/capture \
            --link /fixtures/capture-build/native-replay/build-link.json \
            --expect-receipt sha256:8832edd572eb04f9cab4f24c082628a66f429dc93ef0945e7cf7025f9ee1861d \
            --expect-link sha256:499bad56abc83a7da78928d6557a6429eacfdbc4e60cee634f33d58a8f103419 \
            --expect-omega-binary 3989b0b32395b21f1d33468e3af65225e36c22ea28fa7e931807bb8b02a54d10 \
            --expect-controller 40346dd9adac3c22401cfd9a83a729c164d2951f2baf692bf74b4316f78caff1 \
            --expect-left-record sha256:02249909a7fbd5e5007785b6f4ceb5621b6ad89a34c0f3d4669784e6b9ccad26 \
            --expect-right-record sha256:c050c79699b77eb86afc11c9642d164f4ec364c487dcc1841ab3e1ab6714649a \
            --left-builder builder-a --right-builder builder-b

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Publish multi-architecture image with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
