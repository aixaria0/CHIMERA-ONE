name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup override set 1.90.0
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p chimera-protocol
          mkdir -p dist
          cp target/release/chimera-protocol dist/chimera-protocol-linux-x86_64
          python -m pip wheel . --no-deps --wheel-dir dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
