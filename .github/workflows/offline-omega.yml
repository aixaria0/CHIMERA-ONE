name: Offline OMEGA invocation and capture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-omega:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check out supported personally owned OMEGA source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aixaria0/CHIMERA-OMEGA
          ref: 52a21a8eaa4363d648fdac805900175d81e13f07
          path: tmp/omega-reviewed
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build the reviewed offline verifier
        run: cargo +1.90.0 build --locked --manifest-path tmp/omega-reviewed/Cargo.toml --bin omega
      - name: Invoke saved historical fixtures and verify capture controls
        run: |
          python3 tools/offline-omega-conformance.py \
            --omega-checkout tmp/omega-reviewed \
            --omega-bin tmp/omega-reviewed/target/debug/omega \
            --out "${{ runner.temp }}/one-offline-evidence"
      - name: Preserve invocation receipts, exact reports and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-offline-omega-evidence
          path: ${{ runner.temp }}/one-offline-evidence
          if-no-files-found: error
