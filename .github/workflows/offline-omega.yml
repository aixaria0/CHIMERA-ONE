name: Offline OMEGA retained capture integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-omega:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify retained real capture bytes and reject substitution
        run: |
          python3 tools/recorded-capture-conformance.py \
            --out "${{ runner.temp }}/one-offline-evidence"
      - name: Verify public test-key capture signatures and reject substitution
        run: |
          python3 tools/capture-attestation-conformance.py \
            --out "${{ runner.temp }}/one-attestation-evidence"
      - name: Verify retained native capture and build-link bytes without external access
        run: |
          python3 tools/capture-build-conformance.py \
            --out "${{ runner.temp }}/one-build-link-evidence"
      - name: Preserve invocation receipts, exact reports and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-offline-omega-evidence
          path: ${{ runner.temp }}/one-offline-evidence
          if-no-files-found: error
      - name: Preserve test-key attestations, binding reports and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-capture-attestation-evidence
          path: ${{ runner.temp }}/one-attestation-evidence
          if-no-files-found: error
      - name: Preserve native capture, build-link validation and saved-byte controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-capture-build-link-evidence
          path: ${{ runner.temp }}/one-build-link-evidence
          if-no-files-found: error
